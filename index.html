<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shave the Mammoth</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Figtree:wght@400;500;600&display=swap">
<style>
  /* Layout: the scene fills the frame. A wordmark rests top-left; one quiet strip of controls sits on the bottom edge.
     The game opens on its legend: the first line on the dark while the scene is made, the rest over the opening shot, high in the sky. */
  :root {
    --night: #0b0d12;                      /* ground behind the scene while it loads */
    --ink: #f4ede1;                        /* snow-warm text */
    --ink-dim: rgba(244, 237, 225, 0.66);
    --veil: rgba(13, 15, 21, 0.46);        /* backing for controls over bright snow */
    --veil-strong: rgba(13, 15, 21, 0.78);
    --line: rgba(244, 237, 225, 0.2);
    --amber: #eab676;                      /* the low sun */
    --warn: #ff9d7c;                       /* a full sack */
    --sheet-foot: rgba(16, 18, 24, 0.94);  /* the foot of a shop's list, over what scrolls beneath it */
    --font-display: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    --font-ui: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  body.instant *, body.instant *::before, body.instant *::after { transition: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--night); color: var(--ink); overflow: hidden;
    font-family: var(--font-ui); font-size: 14px; line-height: 1.4;
    -webkit-font-smoothing: antialiased; overscroll-behavior: none;
  }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  /* ---- the opening: loading, and the legend ---- */
  #loading {
    position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column;
    padding-top: max(14px, env(safe-area-inset-top, 0px)); padding-bottom: max(18px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    transition: opacity 1.2s ease;
  }
  /* night until the scene is ready; after that only a shade across the top of the sky, for the words to sit on */
  #loading::before, #loading::after { content: ""; position: absolute; inset: 0; z-index: -1; }
  #loading::before { background: var(--night); transition: opacity 2.2s ease; }
  #loading::after { background: linear-gradient(to bottom, rgba(11, 13, 18, 0.6), rgba(11, 13, 18, 0.34) 32%, rgba(11, 13, 18, 0) 60%); }
  body.ready #loading::before { opacity: 0; }
  body.told #loading { opacity: 0; pointer-events: none; }
  /* one line at a time, each in the same place */
  #legend { flex: 1; display: grid; align-content: start; justify-items: center; width: min(44rem, 100%); margin: clamp(1.4rem, 10vh, 6.5rem) auto 0; text-align: center; }
  #legend p {
    grid-area: 1 / 1; margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(1.3rem, 0.85rem + 2vw, 2.05rem);
    line-height: 1.28; letter-spacing: -0.005em; text-wrap: balance; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 0 26px rgba(0, 0, 0, 0.55);
    opacity: 0; transform: translateY(10px); transition: opacity 1.1s ease, transform 1.4s ease;
  }
  #legend p.on { opacity: 1; transform: none; transition-delay: 0.55s; }   /* (it waits for the line before it to leave) */
  #legend p.off { opacity: 0; transform: translateY(-8px); transition-duration: 0.7s, 0.9s; }
  #legend p.you { font-style: italic; color: var(--amber); font-size: clamp(1.6rem, 1rem + 2.7vw, 2.6rem); }
  .foot { display: grid; justify-items: center; align-items: end; }
  .foot > * { grid-area: 1 / 1; }
  .card { width: min(22rem, 100%); text-align: center; transition: opacity 0.8s ease; }
  body.ready .card { opacity: 0; }
  #skip {
    margin: 0; font-size: 0.76rem; letter-spacing: 0.05em; color: var(--ink-dim); background: var(--veil-strong);
    padding: 6px 13px; border-radius: 999px; opacity: 0; transition: opacity 0.8s ease 1.2s;
  }
  body.ready #skip { opacity: 1; }
  .nomouse { display: none; }
  #track { height: 1px; background: var(--line); overflow: hidden; }
  #bar { height: 100%; background: var(--amber); transform-origin: left; transform: scaleX(0); transition: transform 0.3s ease; }
  #status { margin-top: 0.8rem; font-size: 0.8rem; color: var(--ink-dim); letter-spacing: 0.04em; min-height: 1.2em; }

  /* ---- heads-up display ---- */
  #hud {
    position: fixed; inset: 0; z-index: 3; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
    padding-top: max(14px, env(safe-area-inset-top, 0px)); padding-bottom: max(14px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    opacity: 0; transition: opacity 1.2s ease 0.2s;
  }
  body.told #hud { opacity: 1; }
  body.bare #hud { opacity: 0; transition-delay: 0s; transition-duration: 0.4s; }
  body.bare #hud * { pointer-events: none !important; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .wordmark {
    font-family: var(--font-display); font-size: 1.15rem; font-weight: 400; letter-spacing: 0.005em; margin: 0;
    text-shadow: 0 1px 14px rgba(0, 0, 0, 0.5);
  }
  .wordmark em { font-style: italic; color: var(--amber); }
  #stats {
    font-size: 0.72rem; color: var(--ink-dim); text-align: right; font-variant-numeric: tabular-nums; line-height: 1.5;
    background: var(--veil); padding: 6px 10px; border-radius: 6px; max-width: 60vw; overflow-wrap: anywhere;
  }
  .bottom { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 16px; transition: opacity 0.5s ease; }
  /* with a tool in hand the view is left clear (where there is no mouse, the buttons stay: they are the way back) */
  @media (hover: hover) { body.elf .bottom, body.elf .bottom .panel { opacity: 0; pointer-events: none; } }   /* (the panels too: they ask for the pointer themselves) */
  .panel {
    pointer-events: auto; background: var(--veil); backdrop-filter: blur(10px) saturate(1.2); -webkit-backdrop-filter: blur(10px) saturate(1.2);
    border: 1px solid var(--line); border-radius: 10px; padding: 6px; min-width: 0;
  }
  .views { display: flex; flex-wrap: wrap; gap: 2px; }
  .views button {
    appearance: none; border: 0; background: transparent; color: var(--ink-dim); font: inherit; font-weight: 500;
    padding: 7px 11px; border-radius: 6px; cursor: pointer; white-space: nowrap; transition: color 0.2s, background 0.2s;
  }
  .views button:hover { color: var(--ink); background: rgba(244, 237, 225, 0.08); }
  .views button[aria-pressed="true"] { color: var(--night); background: var(--amber); }
  /* the tools, and the button that picks the chosen one up */
  .shave { display: flex; flex-wrap: wrap; align-items: stretch; gap: 10px 12px; margin-top: 10px; transition: opacity 0.5s ease; }
  .tools { display: flex; flex-wrap: wrap; gap: 2px; }
  .tools button {
    appearance: none; border: 0; background: transparent; color: var(--ink-dim); font: inherit; font-weight: 500;
    padding: 7px 11px; border-radius: 6px; cursor: pointer; white-space: nowrap; transition: color 0.2s, background 0.2s;
  }
  .tools button:hover { color: var(--ink); background: rgba(244, 237, 225, 0.08); }
  .tools button[aria-pressed="true"] { color: var(--night); background: var(--amber); }
  .tools kbd { display: none; margin-right: 7px; opacity: 0.75; color: inherit; }
  .start {
    pointer-events: auto; appearance: none; cursor: pointer; font: inherit; font-weight: 600; letter-spacing: 0.02em;
    padding: 8px 18px; border-radius: 10px; border: 1px solid var(--amber); color: var(--amber); background: var(--veil);
    backdrop-filter: blur(10px) saturate(1.2); -webkit-backdrop-filter: blur(10px) saturate(1.2); transition: color 0.2s, background 0.2s;
  }
  .start:hover { background: var(--amber); color: var(--night); }
  /* with a tool in hand (and a mouse that is busy looking around) the number keys choose, so show them, and step back */
  @media (hover: hover) {
    body.elf .shave { opacity: 0.72; }
    body.elf .tools kbd { display: inline; }
    body.elf .start { display: none; }
  }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .settings { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 6px 12px; }
  .settings label { display: flex; align-items: center; gap: 8px; color: var(--ink-dim); font-size: 0.8rem; letter-spacing: 0.03em; }
  .settings select {
    appearance: none; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
    font: inherit; font-size: 0.85rem; padding: 4px 22px 4px 8px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-dim) 50%), linear-gradient(135deg, var(--ink-dim) 50%, transparent 50%);
    background-position: calc(100% - 12px) 55%, calc(100% - 8px) 55%; background-size: 4px 4px; background-repeat: no-repeat;
  }
  .settings select option { background: var(--night); color: var(--ink); }
  .settings input[type="range"] { width: 7rem; accent-color: var(--amber); }
  .settings button {
    font: inherit; font-size: 0.8rem; letter-spacing: 0.03em; color: var(--ink-dim); background: transparent;
    border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px; cursor: pointer;
  }
  .settings button:hover { color: var(--ink); border-color: var(--ink-dim); }
  .settings button.sure { color: var(--night); background: var(--warn); border-color: var(--warn); }
  #hint {
    pointer-events: none; align-self: center; text-align: center; font-size: 0.82rem; color: var(--ink); letter-spacing: 0.03em;
    background: var(--veil-strong); padding: 7px 14px; border-radius: 999px; margin-bottom: 10px; max-width: 100%;
    opacity: 0; transition: opacity 0.5s ease;
  }
  #hint.show { opacity: 1; }
  kbd { font: inherit; font-weight: 600; color: var(--amber); }
  .touch { display: none; align-self: center; gap: 18px; margin-bottom: 12px; }
  .touch button {
    pointer-events: auto; appearance: none; cursor: pointer;
    width: 4.6rem; height: 4.6rem; border-radius: 50%; border: 1px solid var(--line); background: var(--veil-strong);
    color: var(--ink); font: inherit; font-weight: 600; letter-spacing: 0.04em; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #snip { border-color: var(--amber); color: var(--amber); }
  /* by touch: Walk and Snip appear, and the views and settings make room (the tools and Stop shaving stay) */
  @media (hover: none) { body.elf .touch { display: flex; } body.elf .bottom { display: none; } }
  .readouts { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; min-width: 0; }
  #progress {
    font-size: 0.8rem; font-weight: 600; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; color: var(--amber);
    background: var(--veil); padding: 5px 10px; border-radius: 6px;
  }
  /* what the player has on them: gold, and how full the sack is */
  #purse { display: flex; gap: 6px; }
  #purse span {
    font-size: 0.8rem; font-weight: 600; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; color: var(--amber);
    background: var(--veil); padding: 5px 10px; border-radius: 6px; white-space: nowrap;
  }
  #purse #bag { color: var(--ink); }
  /* what is left in the pack's tank */
  #fuel { width: 8rem; height: 9px; border-radius: 5px; background: var(--veil); border: 1px solid var(--line); overflow: hidden; }
  #fuel i { display: block; height: 100%; background: var(--amber); transform-origin: left center; }
  #fuel.low i { background: var(--warn); }
  body:not(.elf) #fuel { display: none; }
  /* by touch, a ladder or a pack brings two more buttons */
  .touch #rise, .touch #sink { display: none; }
  body.lift .touch #rise, body.lift .touch #sink { display: block; }
  @media (max-width: 420px) { body.lift .touch { gap: 10px; } body.lift .touch button { width: 4.1rem; height: 4.1rem; } }
  #purse #bag.full { color: var(--warn); }
  /* someone within talking distance */
  #prompt {
    pointer-events: auto; align-self: center; appearance: none; cursor: pointer; font: inherit; font-weight: 600; letter-spacing: 0.03em;
    color: var(--ink); background: var(--veil-strong); border: 1px solid var(--amber); padding: 8px 18px; border-radius: 999px; margin-bottom: 10px;
  }
  #prompt kbd { margin-right: 8px; }
  .mid { display: flex; flex-direction: column; justify-content: flex-end; flex: 1; min-height: 0; }

  /* ---- the two shops ---- */
  #dialog {
    position: fixed; inset: 0; z-index: 6; display: grid; place-items: center; background: rgba(11, 13, 18, 0.34);
    padding-top: max(14px, env(safe-area-inset-top, 0px)); padding-bottom: max(14px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  /* with room to spare, the list keeps to one side and whoever is selling can be seen beside it */
  @media (min-width: 60rem) { #dialog { justify-items: start; padding-left: max(4vw, env(safe-area-inset-left, 0px)); } }
  .sheet {
    width: min(35rem, 100%); max-height: 100%; overflow-y: auto; overscroll-behavior: contain; box-sizing: border-box;
    background: var(--veil-strong); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
    border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px 0;
  }
  .sheet h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; line-height: 1.1; margin: 0; }
  .sheet .trade { color: var(--ink-dim); font-size: 0.78rem; letter-spacing: 0.05em; margin: 3px 0 10px; }
  .sheet .says { font-family: var(--font-display); font-style: italic; font-size: 1.06rem; line-height: 1.35; color: var(--amber); margin: 0 0 6px; text-wrap: pretty; min-height: 2.7em; }
  .sheet h3 { font-size: 0.74rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); margin: 18px 0 0; }
  .sheet .note { font-size: 0.8rem; font-style: italic; color: var(--ink-dim); margin: 2px 0 6px; }
  .sheet ul { list-style: none; margin: 0; padding: 0; }
  .sheet li { display: flex; gap: 14px; align-items: center; justify-content: space-between; padding: 9px 0; border-top: 1px solid var(--line); }
  .sheet li > div { min-width: 0; }
  .sheet li strong { display: block; font-weight: 600; }
  .sheet li div span { display: block; font-size: 0.84rem; line-height: 1.35; color: var(--ink-dim); text-wrap: pretty; }
  .sheet button {
    appearance: none; cursor: pointer; font: inherit; font-weight: 600; white-space: nowrap; flex: none;
    color: var(--amber); background: transparent; border: 1px solid var(--amber); border-radius: 999px; padding: 6px 14px; transition: color 0.2s, background 0.2s;
  }
  .sheet button:hover:not(:disabled) { background: var(--amber); color: var(--night); }
  .sheet button.dear { color: var(--ink-dim); border-color: var(--line); }
  .sheet button.use { color: var(--ink); border-color: var(--line); }
  .sheet button:disabled { color: var(--ink-dim); border-color: var(--line); cursor: default; }
  .sheet .have { flex: none; color: var(--amber); font-size: 0.8rem; font-weight: 600; letter-spacing: 0.04em; white-space: nowrap; }
  .sheet .weigh { text-align: center; padding: 6px 0 8px; }
  .sheet .weigh p { margin: 0 0 12px; color: var(--ink-dim); font-size: 0.86rem; }
  .sheet .weigh .big { font-family: var(--font-display); font-size: 2.8rem; line-height: 1; color: var(--ink); margin: 4px 0 6px; font-variant-numeric: tabular-nums; }
  .sheet .weigh .deal { font-size: 1rem; padding: 10px 22px; margin-bottom: 14px; }
  .sheet .weigh .aside { font-style: italic; }
  .sheet footer {
    position: sticky; bottom: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px;
    margin: 12px -20px 0; padding: 12px 20px 14px; border-top: 1px solid var(--line); background: var(--sheet-foot); border-radius: 0 0 14px 14px;
  }
  .sheet .purse { color: var(--amber); font-weight: 600; font-variant-numeric: tabular-nums; }
  /* ---- a scene: the game stops to admire a new tool. Bars close in top and bottom, the controls step back, and the news is given across the foot ---- */
  #bars::before, #bars::after {
    content: ""; position: fixed; left: 0; right: 0; height: 11vh; background: #05060a; z-index: 7; pointer-events: none;
    transition: transform 0.45s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #bars::before { top: 0; transform: translateY(-101%); }
  #bars::after { bottom: 0; transform: translateY(101%); }
  body.cine #bars::before, body.cine #bars::after { transform: none; }
  body.cine #hud, body.cine #dialog { opacity: 0; pointer-events: none; }
  #got {
    position: fixed; left: 0; right: 0; bottom: calc(11vh + clamp(8px, 3vh, 30px)); z-index: 8; pointer-events: none; text-align: center;
    padding: 0 max(16px, env(safe-area-inset-left, 0px)) 0 max(16px, env(safe-area-inset-right, 0px));
    opacity: 0; transform: translateY(14px) scale(0.96); transition: opacity 0.35s ease, transform 0.5s cubic-bezier(0.2, 1.4, 0.4, 1);
    text-shadow: 0 2px 3px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 0, 0, 0.6);
  }
  #got.show { opacity: 1; transform: none; }
  #got p { margin: 0; }
  #got .you { font-size: clamp(0.8rem, 0.7rem + 0.5vw, 1rem); font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink); }
  #got .what { font-family: var(--font-display); font-style: italic; font-size: clamp(2rem, 1.1rem + 4.4vw, 4.2rem); line-height: 1.05; color: var(--amber); text-wrap: balance; }
  #got .quip { font-family: var(--font-display); font-size: clamp(0.95rem, 0.8rem + 0.7vw, 1.25rem); color: var(--ink); margin-top: 0.35em; text-wrap: balance; }
  @media (max-width: 640px) {
    .bottom { flex-direction: column; align-items: stretch; }
    .shave { flex-direction: column; }
    .tools button { padding: 7px 9px; }
    .views button { padding: 7px 9px; }
    .settings input[type="range"] { flex: 1; width: auto; min-width: 5rem; }
  }
  @media (hover: none) { .desk { display: none; } .nomouse { display: inline; } }
  @media (prefers-reduced-motion: reduce) {
    #loading, #hud, #hint { transition-duration: 0.01s; }
    #legend p, #legend p.off { transform: none; transition: opacity 0.4s ease; }
  }
</style>
</head>
<body>
<canvas id="view" tabindex="0" aria-label="A woolly mammoth standing on a snowy steppe at sunset"></canvas>

<div id="loading">
  <p class="wordmark" aria-hidden="true">Shave the <em>Mammoth</em></p>
  <div id="legend">
    <p>Legend has it, great woolly mammoths roamed the earth,</p>
    <p>but then a legend came and shaved them all, and now they are elephants.</p>
    <p class="you">That legend is you.</p>
  </div>
  <div class="foot">
    <div class="card" role="status" aria-live="polite">
      <div id="track"><div id="bar"></div></div>
      <div id="status">Waking up</div>
    </div>
    <p id="skip"><span class="desk">Click or press any key to skip</span><span class="nomouse">Tap to skip</span></p>
  </div>
</div>

<div id="bars" aria-hidden="true"></div>
<div id="got" role="status" aria-live="polite" hidden>
  <p class="you">You got the</p>
  <p class="what"></p>
  <p class="quip"></p>
</div>

<div id="hud">
  <div class="top">
    <p class="wordmark">Shave the <em>Mammoth</em></p>
    <div class="readouts">
      <div id="purse" hidden><span id="gold">0 gold</span><span id="bag">0 g of 100 g</span></div>
      <div id="fuel" role="img" aria-label="What is left in the tank" hidden><i></i></div>
      <div id="progress" hidden>Shorn 0.000%</div>
      <div id="stats" hidden></div>
    </div>
  </div>
  <div class="mid">
    <button type="button" id="prompt" hidden></button>
    <div id="hint"></div>
    <div class="touch">
      <button type="button" id="walk" aria-label="Hold to walk forward">Walk</button>
      <button type="button" id="snip" aria-label="Hold to cut">Cut</button>
      <button type="button" id="rise" aria-label="Hold to go up">Up</button>
      <button type="button" id="sink" aria-label="Hold to come down">Down</button>
    </div>
    <div class="bottom">
      <div class="panel views" role="group" aria-label="Views">
        <button type="button" id="view-0" data-view="0" aria-pressed="true">The mammoth</button>
        <button type="button" id="view-1" data-view="1" aria-pressed="false">In profile</button>
        <button type="button" id="view-2" data-view="2" aria-pressed="false">Into the sun</button>
        <button type="button" id="view-3" data-view="3" aria-pressed="false">The coat</button>
      </div>
      <div class="panel settings">
        <label for="sun">Sun
          <input type="range" id="sun" min="2" max="30" step="0.5" value="6.5" aria-label="Height of the sun above the horizon">
        </label>
        <label for="detail">Detail
          <select id="detail">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high" selected>High</option>
            <option value="ultra">Ultra</option>
          </select>
        </label>
        <button type="button" id="new-game" title="Give him his coat back and start again with nothing">New game</button>
      </div>
    </div>
    <div class="shave">
      <div class="panel tools" role="group" aria-label="Tool">
        <button type="button" id="tool-scissors" data-tool="scissors" aria-pressed="false"><kbd>1</kbd>Small bad scissors</button>
        <button type="button" id="tool-sheep" data-tool="sheep" aria-pressed="false"><kbd>2</kbd>Shears</button>
        <button type="button" id="tool-garden" data-tool="garden" aria-pressed="true"><kbd>3</kbd>Garden clippers</button>
        <button type="button" id="tool-electric" data-tool="electric" aria-pressed="false"><kbd>4</kbd>Electric shears</button>
        <button type="button" id="tool-shaver" data-tool="shaver" aria-pressed="false"><kbd>5</kbd>Beard shaver</button>
        <button type="button" id="tool-sweep" data-tool="sweep" aria-pressed="false" title="Pick up the hair you have cut"><kbd>Q</kbd><span>Bare hands</span></button>
      </div>
      <button type="button" id="view-elf" class="start" aria-pressed="false">Start shaving</button>
    </div>
  </div>
</div>

<div id="dialog" role="dialog" aria-modal="true" aria-label="Shop" hidden><div class="sheet"></div></div>

<script type="module" src="/src/main.js"></script>
</body>
