<!doctype html>
<html><head><meta charset="utf-8"><title>model viewer</title>
<style>html,body{margin:0;height:100%;background:#777;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
</head><body><canvas id="c"></canvas>
<script type="module">
// A plain viewer for judging a model file: ?glb=<path>&mode=lit|clay|wire|base|normal
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = +(q.get('exp') || 1.0);
const scene = new THREE.Scene();
scene.background = new THREE.Color(q.get('bg') ? '#' + q.get('bg') : '#8d9199');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.75;
const key = new THREE.DirectionalLight(0xfff4e6, 2.2); key.position.set(1.5, 2.2, 2.5); scene.add(key);
const camera = new THREE.PerspectiveCamera(22, innerWidth / innerHeight, 0.01, 100);
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
const gltf = await loader.loadAsync(q.get('glb'));
const root = gltf.scene; scene.add(root);
root.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(root), size = box.getSize(new THREE.Vector3()), centre = box.getCenter(new THREE.Vector3());
const info = { meshes: [], bounds: { min: box.min.toArray().map((v) => +v.toFixed(4)), max: box.max.toArray().map((v) => +v.toFixed(4)) }, animations: gltf.animations.map((a) => a.name), bones: 0 };
const mode = q.get('mode') || 'lit';
const clay = new THREE.MeshStandardMaterial({ color: 0xb9b4ac, roughness: 0.75, metalness: 0 });
root.traverse((o) => {
  if (o.isBone) info.bones++;
  if (!o.isMesh) return;
  const g = o.geometry, m = o.material;
  const tex = (t) => (t && t.image ? `${t.image.width}x${t.image.height}` : null);
  info.meshes.push({ name: o.name, skinned: !!o.isSkinnedMesh, tris: Math.round((g.index ? g.index.count : g.attributes.position.count) / 3), verts: g.attributes.position.count,
    attrs: Object.keys(g.attributes).join(','), material: m.name, map: tex(m.map), normalMap: tex(m.normalMap), roughnessMap: tex(m.roughnessMap), metalnessMap: tex(m.metalnessMap), aoMap: tex(m.aoMap),
    roughness: m.roughness, metalness: m.metalness, vertexColors: !!m.vertexColors });
  if (mode === 'clay') { const c = clay.clone(); if (q.has('nm') && m.normalMap) { c.normalMap = m.normalMap; c.normalScale = m.normalScale; } o.material = c; }
  if (mode === 'wire') { o.material = clay.clone(); o.add(new THREE.LineSegments(new THREE.WireframeGeometry(g), new THREE.LineBasicMaterial({ color: 0x101418, transparent: true, opacity: 0.55 }))); }
  if (mode === 'base') { o.material = new THREE.MeshBasicMaterial({ map: m.map, color: m.map ? 0xffffff : m.color, vertexColors: !!m.vertexColors }); }
  if (mode === 'normal') { o.material = new THREE.MeshBasicMaterial({ map: m.normalMap }); }
  if (mode === 'rough') { o.material = new THREE.MeshBasicMaterial({ map: m.roughnessMap }); }
});
window.__info = info;
// view(az, el, zoom, cx, cy): degrees round and up; zoom 1 = the whole thing; cx, cy = where to look, as shares of its width and height from its middle
window.view = (az = 0, el = 5, zoom = 1, cx = 0, cy = 0) => {
  const r = Math.max(size.y, size.x, size.z) * 0.5 / Math.tan((camera.fov * Math.PI) / 360) / zoom * 1.12;
  const a = (az * Math.PI) / 180, e = (el * Math.PI) / 180;
  const target = centre.clone().add(new THREE.Vector3(cx * size.x * Math.cos(a), cy * size.y, -cx * size.x * Math.sin(a)));
  camera.position.set(target.x + r * Math.sin(a) * Math.cos(e), target.y + r * Math.sin(e), target.z + r * Math.cos(a) * Math.cos(e));
  camera.lookAt(target);
  key.position.copy(camera.position).add(new THREE.Vector3(0.6 * r, 0.8 * r, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), a));
  renderer.render(scene, camera);
  renderer.getContext().finish();
};
window.view(+(q.get('az') || 0), +(q.get('el') || 5), +(q.get('zoom') || 1));
window.__shotReady = true;
</script></body></html>
